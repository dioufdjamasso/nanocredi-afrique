<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nanocredi Devis</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f3f4f6;
padding:20px;
}

.phone{
max-width:420px;
margin:auto;
}

.top{
background:white;
padding:20px;
border-radius:20px;
display:flex;
align-items:center;
gap:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.top img{
width:60px;
}

.top h1{
color:#0b6b36;
font-size:28px;
}

.card{
margin-top:20px;
background:#0b6b36;
color:white;
padding:25px;
border-radius:20px;
}

.card h2{
margin:8px 0;
}

.box{
background:white;
margin-top:20px;
padding:20px;
border-radius:20px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.box h4{
color:#0b6b36;
margin-bottom:15px;
}

label{
display:block;
margin-top:15px;
margin-bottom:5px;
font-weight:600;
}

input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:none;
background:#0b6b36;
color:white;
border-radius:10px;
font-size:16px;
font-weight:600;
}

.message{
background:#ffeaea;
padding:15px;
border-radius:10px;
margin-top:15px;
color:#c00;
}

.footer{
text-align:center;
margin-top:20px;
color:#666;
}
</style>
</head>

<body>

<div class="phone">

<div class="top">
<img src="bt.png">
<h1>Nanocredi Devis</h1>
</div>

<div class="card">
<p>Bine ai venit</p>
<h2 id="clientNom">MORARU NICOLAE</h2>
<p>Sold disponibil</p>
<h2 id="clientSolde">500 000 EUR</h2>
</div>

<div class="box">

<h4>Transfer către un cont bancar</h4>

<label>Numele beneficiarului</label>
<input id="nom" type="text" placeholder="Introduceți numele">

<label>IBAN-ul beneficiarului</label>
<input id="iban" type="text" placeholder="Introduceți IBAN-ul">

<label>Numele băncii</label>
<input id="banca" type="text" placeholder="Introduceți banca">

<label>Cod SWIFT / BIC</label>
<input id="swift" type="text" placeholder="Introduceți codul">

<label>Suma de transferat (EUR)</label>

<input
type="number"
id="montant"
oninput="convertir()"
placeholder="Introduceți suma">

<label>Suma convertita (MDL)</label>

<input
type="text"
id="mdl"
readonly>

<button type="button" onclick="transferer()">
Efectuați transferul
</button>

<div id="rezultat"></div>

<div class="message">
<h5>Nu sunteți autorizat</h5>
<p>Vă rugăm să contactați directorul băncii dumneavoastră.</p>
</div>

</div>

<div class="footer">
Nanocredi Devis © 2026
</div>

</div>
<script>

function convertir() {

let montant = document.getElementById("montant").value;

if (montant == "") {
document.getElementById("mdl").value = "";
return;
}

let resultat = montant * 19.5;

document.getElementById("mdl").value =
resultat + " MDL";

}

function transferer() {

let nume = document.getElementById("nom").value;
let iban = document.getElementById("iban").value;
let banca = document.getElementById("banca").value;
let swift = document.getElementById("swift").value;
let mdl = document.getElementById("mdl").value;

document.getElementById("rezultat").innerHTML = `

<div style="background:#f3f3f3;padding:15px;border-radius:10px;margin-top:15px;">

<h3 style="color:green;">Transfer pregătit</h3>

<p><b>Beneficiar:</b> ${nume}</p>

<p><b>IBAN:</b> ${iban}</p>

<p><b>Banca:</b> ${banca}</p>

<p><b>SWIFT:</b> ${swift}</p>

<p><b>Suma:</b> ${mdl}</p>

<button onclick="valideaza()"
style="margin-top:15px;padding:12px;width:100%;background:#0b6b36;color:white;border:none;border-radius:10px;">

Validează

</button>

<div id="confirmare"></div>

</div>

`;

}

function valideaza() {

document.getElementById("confirmare").innerHTML = `

<div style="background:#ffeaea;padding:15px;border-radius:10px;margin-top:15px;color:#c00;">

<h4>Nu sunteți încă autorizat să efectuați tranzacția.</h4>

<p>Vă rugăm să contactați directorul băncii.</p>

</div>

`;

}


const params = new URLSearchParams(window.location.search);

const nomClient =
params.get("nom") || "MORARU NICOLAE";

const solde =
params.get("solde") || "500 000 EUR";

document.getElementById("clientNom").innerText =
nomClient;

document.getElementById("clientSolde").innerText =
solde;

</script>
</body>
</html>
