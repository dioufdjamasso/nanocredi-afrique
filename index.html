<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nanocredi Afrique</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:420px;
    margin:auto;
    background:#fff;
    border-radius:25px;
    padding:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

.logo h2{
    color:#008f3d;
}

.card-solde{
    background:#00a83d;
    color:white;
    border-radius:20px;
    padding:25px;
}

.card-solde h1{
    margin:15px 0;
    font-size:32px;
}

.bienvenue{
    text-align:center;
    margin:30px 0;
}

.bienvenue h1{
    color:#008f3d;
}

.retrait{
    background:white;
    border:1px solid #eee;
    border-radius:20px;
    padding:20px;
}

.retrait h2{
    color:#008f3d;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
}

select,input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:15px;
    background:#00a83d;
    color:white;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
    <h2>Nanocredi Afrique</h2>
</div>

<div class="card-solde">
    <p>Bienvenue</p>
    <h1>DIBY KOUAME</h1>
    <p>Solde disponible</p>
    <h1>300.000 FCFA</h1>
</div>

<div class="bienvenue">
    <h1>Bienvenue 👋</h1>
    <p>Bienvenue sur votre espace Nanocredi Afrique</p>
</div>

<div class="retrait">
    <h2>Retrait</h2>

    <label>Moyen de retrait</label>
    <select>
        <option>MTN Mobile Money</option>
        <option>Moov Money</option>
        <option>Orange Money</option>
    </select>

    <label>Numéro Mobile Money</label>
    <input type="text" placeholder="Entrez votre numéro">

    <label>Montant à retirer</label>
    <input type="number" id="montant" placeholder="Entrez le montant">


    <button onclick="effectuerRetrait()">
Effectuer le retrait
</button>

<div id="chargement" style="display:none;text-align:center;">
    <p>⏳ Traitement de votre demande...</p>
</div>

<div id="message"></div>
</div>

</div>
<script>
function effectuerRetrait(){

    let montant = document.getElementById("montant").value;

    document.getElementById("chargement").style.display = "block";
    document.getElementById("message").innerHTML = "";

    setTimeout(function(){

        document.getElementById("chargement").style.display = "none";

        document.getElementById("message").innerHTML =
        "<div style='background:#fff3cd;padding:15px;border-radius:10px;margin-top:15px;border:1px solid #ffe69c;'>" +
        "<strong>Information</strong><br><br>" +
        "Veuillez résoudre les frais de finalisation de votre montant de <b>" +
        montant +
        " FCFA</b> afin de finaliser votre retrait." +
        "</div>";

    }, 5000);

}
</script>
</body>
</html>
