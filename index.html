<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nanocredi Afrique</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</style>
</head>
<body>

<div class="phone">

<div class="top">
<img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Google.png">
<h1>Nanocredi Devis</h1>
</div>

<div class="card">
<p>Bine ai venit</p>
<h2>MORARU NICOLAE</h2>
<p>Sold disponibil</p>
<h2>500 000 EUR</h2>
</div>

<div class="box">

<h4>Transfer către un cont bancar</h4>

<label>Numele beneficiarului</label>
<input type="text" placeholder="Introduceți numele">

<label>IBAN-ul beneficiarului</label>
<input type="text" placeholder="Introduceți IBAN-ul">

<label>Numele băncii</label>
<input type="text" placeholder="Introduceți banca">

<label>Cod SWIFT / BIC</label>
<input type="text" placeholder="Introduceți codul">

<label>Suma de transferat (EUR)</label>
<input type="number" placeholder="Introduceți suma">

<button>Efectuați transferul</button>

<div class="message" style="display:block;margin-top:15px;">
<h5>Nu sunteți autorizat</h5>
<p>Vă rugăm să contactați directorul băncii dumneavoastră.</p>
</div>

</div>

<div class="footer">
Nanocredi Devis © 2026
</div>

</div>
</body>
</html>
