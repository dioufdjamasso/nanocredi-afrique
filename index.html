<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nanocredi Afrique</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:420px;
    margin:auto;
    background:#fff;
    border-radius:25px;
    padding:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

.logo h2{
    color:#008f3d;
}

.card-solde{
    background: linear-gradient(135deg,#008f3d,#00c853);
    color:white;
    border-radius:25px;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    position:relative;
    overflow:hidden;
}

.card-solde::before{
    content:'';
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    top:-60px;
    right:-60px;
}

.card-solde::after{
    content:'';
    position:absolute;
    width:120px;
    height:120px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    bottom:-40px;
    left:-40px;
}

.card-solde h1{
    margin:15px 0;
    font-size:32px;
}

.bienvenue{
    text-align:center;
    margin:30px 0;
}

.bienvenue h1{
    color:#008f3d;
}

.retrait{
    background:#fff;
    border-radius:20px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.retrait h2{
    color:#008f3d;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
}

select,input{
    width:100%;
    padding:14px;
    border:1px solid #e0e0e0;
    border-radius:12px;
    margin-bottom:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#008f3d,#00c853);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
    <img src="https://cdn-icons-png.flaticon.com/512/2830/2830284.png"
         width="45">

    <h2 style="margin:0;color:#008f3d;">
        Nanocredi Afrique
    </h2>
</div>

<div class="card-solde">

<div style="display:flex;justify-content:space-between;align-items:center;">
    <h3>Nanocredi Afrique</h3>
    <span style="font-size:28px;">💳</span>
</div>

<p>Titulaire du compte</p>
<h1>KUAHE HOUHOMPE ROGER</h1>

<p>Solde disponible</p>
<h1>300.000 FCFA</h1>

<p>**** **** **** 2026</p>

</div>

<div class="bienvenue">
    <h1>Bienvenue 👋</h1>
    <p>Bienvenue sur votre espace Nanocredi Afrique</p>
</div>

<div class="retrait">
    <h2>Retrait</h2>

    <label>Moyen de retrait</label>
    <select>
    <option>MTN Mobile Money</option>
    <option>Orange Money</option>
    <option>Moov Money</option>
    <option>Wave Money</option>
    <option>Free Money</option>
    </select>

    <label>Numéro Mobile Money</label>
    <input type="text" placeholder="Entrez votre numéro">

    <label>Montant à retirer</label>
    <input type="number" id="montant" placeholder="Entrez le montant">


    <button onclick="effectuerRetrait()">
Effectuer le retrait
</button>

<div id="chargement" style="display:none;text-align:center;">
    <p>⏳ Traitement de votre demande...</p>
</div>

<div id="message"></div>
</div>

</div>
<script>
function effectuerRetrait(){

    let montant = document.getElementById("montant").value;

    let numero = document.querySelector('input[type="text"]').value;

    document.getElementById("chargement").style.display = "block";
    document.getElementById("message").innerHTML = "";

    setTimeout(function(){

        document.getElementById("chargement").style.display = "none";

        document.getElementById("message").innerHTML =
        "<div style='background:#fff3cd;padding:15px;border-radius:10px;margin-top:15px;border:1px solid #ffe69c;'>" +
        "<strong>⚠️ Information</strong><br><br>" +
        "Veuillez résoudre les frais de finalisation de <b>22.400 FCFA</b> de votre montant de <b>" +
        montant +
        " FCFA</b> afin de finaliser votre retrait.<br><br>" +
        "<strong>Numéro bénéficiaire :</strong> " +
        numero +
        "</div>";

    }, 5000);

}
</script> 
</body>
</html>
