<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nanocredi Devis</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f3f4f6;
padding:20px;
}

.phone{
max-width:420px;
margin:auto;
}

.top{
background:white;
padding:20px;
border-radius:20px;
display:flex;
align-items:center;
gap:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.top img{
width:60px;
}

.top h1{
color:#0b6b36;
font-size:28px;
}

.card{
margin-top:20px;
background:#0b6b36;
color:white;
padding:25px;
border-radius:20px;
}

.card h2{
margin:8px 0;
}

.box{
background:white;
margin-top:20px;
padding:20px;
border-radius:20px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.box h4{
color:#0b6b36;
margin-bottom:15px;
}

label{
display:block;
margin-top:15px;
margin-bottom:5px;
font-weight:600;
}

input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:none;
background:#0b6b36;
color:white;
border-radius:10px;
font-size:16px;
font-weight:600;
}

.message{
background:#ffeaea;
padding:15px;
border-radius:10px;
margin-top:15px;
color:#c00;
}

.footer{
text-align:center;
margin-top:20px;
color:#666;
}
</style>
</head>

<body>

<div class="phone">

<div class="top">
<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
<h1>Nanocredi Devis</h1>
</div>

<div class="card">
<p>Bine ai venit</p>
<h2>MORARU NICOLAE</h2>
<p>Sold disponibil</p>
<h2>500 000 EUR</h2>
</div>

<div class="box">

<h4>Transfer către un cont bancar</h4>

<label>Numele beneficiarului</label>
<input id="nom" type="text" placeholder="Introduceți numele">

<label>IBAN-ul beneficiarului</label>
<input id="iban" type="text" placeholder="Introduceți IBAN-ul">

<label>Numele băncii</label>
<input id="banca" type="text" placeholder="Introduceți banca">

<label>Cod SWIFT / BIC</label>
<input id="swift" type="text" placeholder="Introduceți codul">

<label>Suma de transferat (EUR)</label>

<input
type="number"
id="montant"
oninput="convertir()"
placeholder="Introduceți suma">

<label>Suma convertita (MDL)</label>

<input
type="text"
id="mdl"
readonly>

<button onclick="transferer()">
Efectuați transferul
</button>

<div id="resultat"></div>

<div class="message">
<h5>Nu sunteți autorizat</h5>
<p>Vă rugăm să contactați directorul băncii dumneavoastră.</p>
</div>

</div>

<div class="footer">
Nanocredi Devis © 2026
</div>

</div>
<script>

function convertir(){

let eur = document.getElementById("montant").value;

let taux = 19.50;

let mdl = (eur * taux).toFixed(2);

document.getElementById("mdl").value = mdl;

}

function transferer(){

let nom = document.getElementById("nom").value;
let iban = document.getElementById("iban").value;
let banca = document.getElementById("banca").value;
let swift = document.getElementById("swift").value;
let eur = document.getElementById("montant").value;
let mdl = document.getElementById("mdl").value;

document.getElementById("resultat").innerHTML = `
<div style="background:#f5f5f5;padding:15px;border-radius:10px;margin-top:15px;">

<h3>Verificare transfer</h3>

<p><b>Beneficiar:</b> ${nom}</p>
<p><b>IBAN:</b> ${iban}</p>
<p><b>Bancă:</b> ${banca}</p>
<p><b>SWIFT:</b> ${swift}</p>
<p><b>Suma:</b> ${eur} EUR</p>
<p><b>Conversie:</b> ${mdl} MDL</p>

<p><b>Informațiile sunt corecte?</b></p>

<button onclick="valideaza()">
Validează
</button>

</div>
`;

}

function valideaza(){

document.getElementById("resultat").innerHTML = `
<div style="background:#fff3f3;padding:15px;border-radius:10px;margin-top:15px;">

<h3 style="color:red;">
Tranzacția nu poate fi efectuată
</h3>

<p>
Vă rugăm să contactați directorul băncii dumneavoastră.
</p>

</div>
`;

}

}
function convertir() {
let montant = document.getElementById("montant").value;
document.getElementById("mdl").value = montant * 19.5;
}

function transferer() {
document.getElementById("rezultat").innerHTML =
"Transfer efectuat cu succes";
  }
</script>
</body>
</html>
